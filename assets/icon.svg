<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203f"/>
      <stop offset="0.55" stop-color="#0b1228"/>
      <stop offset="1" stop-color="#070b1c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8f2"/>
      <stop offset="1" stop-color="#e4e6db"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d4ca8"/>
      <stop offset="0.5" stop-color="#1a6fda"/>
      <stop offset="1" stop-color="#0d4ca8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App background squircle -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="208" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- subtle dispatch grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
    <line x1="64" y1="320" x2="960" y2="320"/>
    <line x1="64" y1="512" x2="960" y2="512"/>
    <line x1="64" y1="704" x2="960" y2="704"/>
    <line x1="320" y1="64" x2="320" y2="960"/>
    <line x1="704" y1="64" x2="704" y2="960"/>
  </g>

  <!-- License plate -->
  <g filter="url(#shadow)" transform="rotate(-4 512 512)">
    <rect x="216" y="338" width="592" height="348" rx="36" fill="#10100f"/>
    <rect x="232" y="354" width="560" height="316" rx="26" fill="url(#plate)"/>

    <!-- MERCOSUR strip -->
    <rect x="232" y="354" width="560" height="74" rx="26" fill="url(#strip)"/>
    <rect x="232" y="404" width="560" height="24" fill="url(#strip)"/>
    <text x="512" y="402" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700"
          letter-spacing="3" fill="#ffffff" text-anchor="middle">REPÚBLICA ARGENTINA</text>
    <circle cx="276" cy="391" r="11" fill="#f6c947"/>
    <circle cx="748" cy="391" r="11" fill="#f6c947"/>

    <!-- DR monogram -->
    <text x="512" y="612" font-family="'Courier New', monospace" font-size="210" font-weight="700"
          letter-spacing="14" fill="#15151a" text-anchor="middle">DR</text>

    <!-- anti-counterfeit diagonal hint -->
    <g clip-path="none" opacity="0.05">
      <line x1="260" y1="640" x2="320" y2="440" stroke="#000" stroke-width="6"/>
      <line x1="704" y1="640" x2="764" y2="440" stroke="#000" stroke-width="6"/>
    </g>
  </g>

  <!-- civic accent dot -->
  <circle cx="512" cy="792" r="13" fill="#4ad9c2"/>
</svg>
